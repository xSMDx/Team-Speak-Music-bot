# /etc/nginx/sites-available/tsmb
# Replace music.example.com with your domain. This only answers for that hostname, so other sites on the server are untouched.
# After enabling it, run:  sudo certbot --nginx -d music.example.com   (adds HTTPS automatically)

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    # must be >= MAX_UPLOAD_MB in .env
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # live updates (Server-Sent Events) and big uploads
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
